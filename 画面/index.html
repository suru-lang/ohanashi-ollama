<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おはなし</title>
<link rel="icon" href="するぞう.svg" type="image/svg+xml">
<link rel="stylesheet" href="様式.css">
</head>
<body>
<aside id="横欄">
  <div class="横欄頭">
    <img src="するぞう.svg" alt="" class="印">
    <span class="名">おはなし</span>
    <button id="横欄閉じる" type="button" class="小 携帯のみ" aria-label="一覧を閉じる">✕</button>
  </div>
  <button id="新規" type="button" class="主">＋ 新しい会話</button>
  <input id="検索" type="search" placeholder="会話を探す" aria-label="会話を探す" autocomplete="off">
  <nav id="一覧" aria-label="会話の一覧"></nav>
  <div id="接続先" class="淡"></div>
</aside>
<div id="覆い" hidden></div>
<div id="落とし覆い" hidden><div>ここに落とすと、画像・PDF・文字のファイルを問いに添えます</div></div>
<div id="本面">
  <header>
    <button id="横欄開く" type="button" class="小 携帯のみ" aria-label="会話の一覧">☰</button>
    <span id="会話題" class="淡" title="クリックで会話の題を変えます" hidden></span>
    <h1 id="題" title="クリックでスレッドの題を変えます">新しい会話</h1>
    <button id="新スレッド" type="button" class="小" title="この会話に新しいスレッドを作ります。リポジトリなどの設定はそのまま使えます" hidden>＋<span class="字"> スレッド</span></button>
    <select id="モデル" aria-label="モデル"></select>
    <button id="設定開く" type="button" class="小" aria-label="設定" aria-expanded="false">⚙<span id="決まり数" class="小字" hidden></span></button>
  </header>
  <section id="設定欄" hidden>
    <div id="決まり欄">
      <span class="欄名">📜 決まり(印を付けた決まりを、モデルが答えるたびに読みます)</span>
      <ul id="決まり一覧"></ul>
      <div class="行 決まり行">
        <span id="決まり字数" class="淡 小字"></span>
        <button id="決まり直す" type="button" class="小" aria-expanded="false">決まりを作る・直す</button>
      </div>
      <div id="決まり編集" hidden>
        <div class="行 決まり行">
          <select id="決まり選択" aria-label="直す決まり"></select>
          <input id="決まり名" placeholder="名前(例: コードを書くときの決まり)" aria-label="決まりの名前" autocomplete="off">
        </div>
        <textarea id="決まり内容" rows="8" placeholder="例:&#10;- 今のコードの書き方に合わせる&#10;- 変えるのは頼まれた所だけにする&#10;- 動かして確かめてから答える" aria-label="決まりの中身"></textarea>
        <div class="行 決まり行">
          <label class="並び"><input id="決まり既定" type="checkbox"> 新しい会話に最初から付ける</label>
          <span id="決まり内容字数" class="淡 小字"></span>
        </div>
        <div class="行 決まり行">
          <button id="決まり保存" type="button" class="小 主">保存</button>
          <button id="決まり消す" type="button" class="小">消す</button>
          <button id="決まり閉じる" type="button" class="小">閉じる</button>
          <span id="決まり案内" class="淡 小字">Markdown で書けます。モデルにはそのまま渡します。直すと、付けているすべての会話の次の答えから効きます。</span>
        </div>
      </div>
    </div>
    <label>指示(この会話だけの指示。システムプロンプト)
      <textarea id="指示" rows="3" placeholder="例: 日本語で、短く答えてください。"></textarea>
    </label>
    <label>📒 メモ(どのスレッドでも、モデルが「これまでのスレッドで分かったこと」として読みます。答えの「メモに足す」でも足せます)
      <textarea id="メモ" rows="3" placeholder="例: 作業の枝は ohanashi/fix-login。試験は kumu 試験 で動かす。"></textarea>
      <span id="メモ字数" class="淡 小字"></span>
    </label>
    <div class="行">
      <label class="並び"><input id="温度既定" type="checkbox" checked> 温度はモデルの既定</label>
      <label class="並び">温度 <input id="温度" type="range" min="0" max="2" step="0.1" value="0.8" disabled> <output id="温度値">0.8</output></label>
    </div>
    <label class="並び" id="砂場網欄" hidden><input id="砂場網" type="checkbox"> 💻 砂場からインターネットにつなぐ(pip install・apt-get install を使えるようにする)</label>
    <div id="倉欄" hidden>
      <span class="欄名">🐙 GitHub のリポジトリ(この会話で読むもの)</span>
      <ul id="倉一覧"></ul>
      <div class="行 倉追加">
        <input id="倉名" list="倉候補" placeholder="owner/名前" aria-label="足すリポジトリ" autocomplete="off">
        <datalist id="倉候補"></datalist>
        <select id="倉権限" aria-label="権限" title="Write にすると、モデルが確かめずに issue を作る・直す・コメントする・閉じることがあります">
          <option value="read">Read(読むだけ)</option>
          <option value="write">Write(issue を書いてもよい)</option>
        </select>
        <button id="倉足す" type="button" class="小">足す</button>
      </div>
      <span id="倉案内" class="淡 小字"></span>
    </div>
    <div class="行" id="更新欄" hidden>
      <button id="再起動" type="button" class="小">🔄 最新にして再起動</button>
      <span id="更新状態" class="淡 小字"></span>
    </div>
    <p class="淡 小字">設定は会話ごとにしまい、この会話のすべてのスレッドに効きます。次に送るときから使います。</p>
  </section>
  <div id="知らせ" hidden></div>
  <main id="会話" aria-live="polite">
    <div id="ようこそ">
      <img src="するぞう.svg" alt="" class="大印">
      <p>ローカルの Ollama とおしゃべりします。<br>下の欄に書いて Enter で送ります(Shift+Enter で改行)。</p>
    </div>
  </main>
  <div id="添付欄" hidden aria-label="添えるもの"></div>
  <form id="入力欄">
    <button id="添付ボタン" type="button" class="切替" aria-label="画像・PDF・文字のファイルを添える" title="画像・PDF・文字のファイルを添えます(画面に落とす・入力欄に貼るでも添えられます)">📎</button>
    <input id="添付選択" type="file" multiple hidden accept="image/*,application/pdf,.pdf,text/*,.md,.csv,.tsv,.json,.yaml,.yml,.toml,.xml,.py,.js,.ts,.go,.rs,.c,.h,.cpp,.java,.sh,.sql,.suru">
    <textarea id="文" rows="1" placeholder="メッセージを書く" autofocus></textarea>
    <button id="ウェブ" type="button" class="切替" aria-label="ウェブで調べる" aria-pressed="false" disabled title="起動するときに SEARXNG_URL か OLLAMA_API_KEY を設定すると、ウェブで調べてから答えます">🌐<span class="字"> ウェブ</span></button>
    <button id="砂場" type="button" class="切替" aria-label="砂場でコードを動かす" aria-pressed="false" disabled title="Docker が使えると、モデルが砂場(コンテナ)でコードを書いて動かします">💻<span class="字"> 砂場</span></button>
    <button id="GitHub" type="button" class="切替" aria-label="GitHub を読む" aria-pressed="false" disabled title="起動するときに --github-repos を付けると、会話のリポジトリをモデルが読みます">🐙<span class="字"> GitHub</span></button>
    <button id="送る" type="submit" class="主">送る</button>
    <button id="止める" type="button" hidden>止める</button>
  </form>
</div>
<script src="書式.js"></script>
<script src="道.js"></script>
<script src="動き.js"></script>
<script src="頁.js"></script>
<script src="添付.js"></script>
</body>
</html>
