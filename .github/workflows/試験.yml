# kumu 試験・kumu 点検・Markdown の変換の試験と、偽の Ollama(偽の web 検索 API も)を相手にアプリ全体を Linux と macOS で動かします。
name: 試験

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: clang と libsqlite3 と OpenSSL を入れる(Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev libssl-dev
      - name: libsqlite3 と OpenSSL の pkg-config を探せるようにする(macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: kumu と suruc を入れる
        # @main は Go のモジュールのプロキシが少し前の main を覚えていることがあるので、GitHub から直接取る
        env:
          GOPROXY: direct
        run: |
          go install github.com/suru-lang/suru/cmd/kumu@main
          go install github.com/suru-lang/suru/cmd/suruc@main
      - name: 試験
        run: ~/go/bin/kumu 試験
      - name: 点検
        run: ~/go/bin/kumu 点検
      - name: Markdown の変換の試験
        run: node 道具/書式試験.js
      - name: 偽の Ollama を相手に動かす
        run: |
          ~/go/bin/kumu 作る
          ~/go/bin/suruc 道具/偽Ollama.suru -o 出力/偽Ollama
          ./出力/偽Ollama 11435 > 出力/偽Ollama.log 2>&1 &
          OLLAMA_API_KEY=試し鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11435 --db 出力/試し.db --port 8090 --web-search http://127.0.0.1:11435/api/web_search > 出力/アプリ.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8090/ && break; sleep 0.2; done
          B=http://127.0.0.1:8090
          curl -s -o /dev/null -w '%{http_code} %{content_type}\n' $B/ | grep -x '200 text/html; charset=utf-8'
          curl -s $B/api/info | grep -F '"version":"0.0.0-偽","web":true'
          curl -s $B/api/models | grep -F '{"models":["偽","偽-考える"]}'
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations | grep -F '"id":1'
          curl -s -X POST -d '{"role":"user","content":"やあ"}' $B/api/conversations/1/messages | grep -F '"title":"やあ"'
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | tee 出力/答え
          grep -F '{"stats":{"tokens":12,"seconds":0.5}}' 出力/答え
          [ "$(grep -o '"content":"[^"]*"' 出力/答え | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "おうむ返し: やあ" ]
          curl -s -X POST -d '{"role":"assistant","content":"おうむ返し: やあ"}' $B/api/conversations/1/messages | grep -F '{"role":"assistant","content":"おうむ返し: やあ"}'
          curl -s $B/api/conversations | grep -F '"title":"やあ"'
          curl -s -X POST -d '{"q":"やあ"}' $B/api/search | grep -F '"snippet":"やあ"'
          curl -s -X POST -d '{"q":"ない言葉"}' $B/api/search | grep -x '\[\]'
          # ウェブ検索: 先に出典が届き、モデルには検索の結果が渡る(偽の Ollama は「 [検索あり]」を付ける)
          curl -s -X POST -d '{"role":"user","content":"天気"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"web":true}' $B/api/chat | tee 出力/検索答え
          head -1 出力/検索答え | grep -F '{"sources":[{"title":"天気 の結果 1","url":"https://example.com/1"}'
          [ "$(grep -o '"content":"[^"]*"' 出力/検索答え | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "おうむ返し: 天気 [検索あり]" ]
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | grep -c sources | grep -x 0
          # SearXNG: 問いを URL に符号化して送り、はじめの5つを使う(偽の SearXNG は6つ返す)
          ./出力/ohanashi-ollama --ollama http://127.0.0.1:11435 --db 出力/試し.db --port 8091 --searxng http://127.0.0.1:11435/ > 出力/アプリ2.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8091/ && break; sleep 0.2; done
          curl -s http://127.0.0.1:8091/api/info | grep -F '"web":true'
          curl -s -X POST -d '{"conversation":1,"web":true}' http://127.0.0.1:8091/api/chat | tee 出力/SearXNG答え
          head -1 出力/SearXNG答え | grep -F '{"sources":[{"title":"%E5%A4%A9%E6%B0%97 の結果 1"'
          [ "$(head -1 出力/SearXNG答え | grep -o '"url"' | wc -l | tr -d ' ')" = 5 ]
          [ "$(grep -o '"content":"[^"]*"' 出力/SearXNG答え | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "おうむ返し: 天気 [検索あり]" ]
          kill %3
          curl -s -o /dev/null -w '%{http_code}\n' -H 'Origin: http://evil.example' $B/api/conversations | grep -x 403
          curl -s -X PUT -d '{"model":"ない"}' $B/api/conversations/1 > /dev/null
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | grep -F "{\"error\":\"Ollama: model 'ない' not found"
          node -e '
            const ws = new WebSocket("ws://127.0.0.1:8090/ws"); const got = [];
            const t = setTimeout(() => { console.error("時間切れ", got); process.exit(1); }, 10000);
            const 開いた = new Promise((r) => (ws.onopen = r));
            const 変えた = fetch("http://127.0.0.1:8090/api/conversations/1", { method: "PUT", body: JSON.stringify({ model: "偽-考える" }) });
            Promise.all([開いた, 変えた]).then(() => ws.send(JSON.stringify({ conversation: 1 })));
            ws.onmessage = (e) => { got.push(JSON.parse(e.data)); if (got.at(-1).done) ws.close(); };
            ws.onclose = () => {
              clearTimeout(t);
              const 答え = got.map((g) => g.content || "").join(""), 考え = got.map((g) => g.thinking || "").join("");
              console.log(答え, 考え);
              process.exit(答え.startsWith("おうむ返し: ") && 考え === "ふむふむ" ? 0 : 1);
            };'
          curl -s -X DELETE $B/api/conversations/1 | grep -F '{"deleted":true}'
          kill %1 %2
      - name: 偽の GitHub を相手に、会話のリポジトリを読む
        run: |
          ./出力/偽Ollama 11436 > 出力/偽Ollama5.log 2>&1 &
          F=$!
          GITHUB_TOKEN=試し鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11436 --db 出力/GitHub.db --port 8093 --github-api http://127.0.0.1:11436 --github-repos o/r,p/* > 出力/アプリ5.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8093/ && break; sleep 0.2; done
          B=http://127.0.0.1:8093
          grep -F 'GitHub: 試し としてつながりました。使えるリポジトリ: o/r,p/*' 出力/アプリ5.log
          if grep -F '試し鍵' 出力/アプリ5.log; then exit 1; fi
          curl -s $B/api/info | grep -F '"github":true,"githubRepos":["o/r","p/*"],"githubUser":"試し"'
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations | grep -F '"repos":[]'
          # 許していないリポジトリ(x/y)は残らない。大文字小文字は書いたまま
          curl -s -X PUT -d '{"repos":[{"repo":"o/r"},{"repo":"x/y","write":true},{"repo":"p/Tools","write":true}]}' $B/api/conversations/1 | grep -F '"repos":[{"repo":"o/r","write":false},{"repo":"p/Tools","write":true}]'
          curl -s -X POST -d '{"role":"user","content":"GitHub の README を読んで"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"github":true}' $B/api/chat | tee 出力/GitHub答え
          grep -F '{"running":"🐙 o/r の README.md を読んでいます"}' 出力/GitHub答え
          grep -F '{"tool":{"name":"github_file","summary":"🐙 o/r の README.md を読みました(2 行)"}}' 出力/GitHub答え
          # 読んだ中身がモデルに返り、もう一度答える(偽の Ollama は道具の結果をおうむ返しする)
          [ "$(grep -o '"content":"[^"]*"' 出力/GitHub答え | sed 's/"content":"//; s/"$//' | tr -d '\n')" = '読みます。おうむ返し: # 試し\nこんにちは\n' ]
          # 🐙 を押していなければ道具を渡さない
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | grep -c running | grep -x 0
          # リポジトリのない会話では知らせる
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations > /dev/null
          curl -s -X POST -d '{"role":"user","content":"GitHub"}' $B/api/conversations/2/messages > /dev/null
          curl -s -X POST -d '{"conversation":2,"github":true}' $B/api/chat | grep -F '{"notice":"この会話には GitHub のリポジトリがありません。⚙ の設定で足してください"}'
          kill $A
          # 鍵が違えば、起動のときに知らせる(鍵は出さない)
          GITHUB_TOKEN=違う鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11436 --db 出力/GitHub.db --port 8098 --github-api http://127.0.0.1:11436 --github-repos o/r > 出力/アプリ6.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8098/ && break; sleep 0.2; done
          grep -F '注意: GitHub の鍵を確かめられませんでした(GitHub の鍵が違うか、期限が切れています(401): Bad credentials)。' 出力/アプリ6.log
          if grep -F '違う鍵' 出力/アプリ6.log; then exit 1; fi
          curl -s http://127.0.0.1:8098/api/info | grep -F '"github":true,"githubRepos":["o/r"],"githubUser":""'
          kill $A $F
      - name: 偽の GitHub を相手に、読み書きのリポジトリに issue を書く
        run: |
          ./出力/偽Ollama 11439 > 出力/偽Ollama7.log 2>&1 &
          F=$!
          GITHUB_TOKEN=試し鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11439 --db 出力/GitHub書.db --port 8099 --github-api http://127.0.0.1:11439 --github-repos o/r,p/* > 出力/アプリ7.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8099/ && break; sleep 0.2; done
          B=http://127.0.0.1:8099
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations > /dev/null
          # 読むだけの o/r には書かない(書く道具は、読み書きの p/tools のために渡している)
          curl -s -X PUT -d '{"repos":[{"repo":"o/r"},{"repo":"p/tools","write":true}]}' $B/api/conversations/1 > /dev/null
          curl -s -X POST -d '{"role":"user","content":"GitHub に issue を作って"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"github":true}' $B/api/chat | tee 出力/書答え1
          grep -F '{"running":"🐙 o/r に issue を作っています"}' 出力/書答え1
          grep -F '"summary":"🐙 書けませんでした: o/r は、この会話では読むだけです。' 出力/書答え1
          # 読み書きなら書く。本文の終わりに、書いたモデルを付ける
          curl -s -X PUT -d '{"repos":[{"repo":"o/r","write":true}]}' $B/api/conversations/1 > /dev/null
          curl -s -X POST -d '{"conversation":1,"github":true}' $B/api/chat | tee 出力/書答え2
          grep -F '{"tool":{"name":"github_issue","summary":"🐙 o/r に issue [#7](https://github.com/o/r/issues/7) を作りました: 試しの issue"}}' 出力/書答え2
          grep -o '"content":"[^"]*"' 出力/書答え2 | sed 's/"content":"//; s/"$//' | tr -d '\n' > 出力/書答え2.文
          grep -F 'created #7: https://github.com/o/r/issues/7' 出力/書答え2.文
          # 偽の GitHub は届いた本文を title に入れて返す(「"」は上の取り出しで消える)
          grep -F 'title\:\試しの issue\,\body\:\動きません\\n\\n— ohanashi-ollama(偽) で書きました\,\labels\:[\bug\]' 出力/書答え2.文
          curl -s -X POST -d '{"role":"user","content":"GitHub の issue を閉じて"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"github":true}' $B/api/chat | tee 出力/書答え3
          grep -F '{"tool":{"name":"github_issue","summary":"🐙 o/r の [#1](https://github.com/o/r/issues/1) を閉じました(予定なし)"}}' 出力/書答え3
          kill $A $F
      - name: 砂場(Docker)でコードを動かす(Linux)
        # macOS の GitHub の機械には Docker がないので Linux だけで。偽の Ollama は「コード」を含む問いに、hello.py を書いて動かす道具を呼ぶ
        if: runner.os == 'Linux'
        run: |
          ./出力/偽Ollama 11435 > 出力/偽Ollama.log 2>&1 &
          ./出力/ohanashi-ollama --ollama http://127.0.0.1:11435 --db 出力/砂場.db --port 8092 --work 出力/作業 > 出力/アプリ3.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8092/ && break; sleep 0.2; done
          B=http://127.0.0.1:8092
          grep -F '砂場: Docker' 出力/アプリ3.log
          curl -s $B/api/info | grep -F '"sandbox":true'
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations | grep -F '"id":1'
          curl -s -X POST -d '{"role":"user","content":"コードを書いて"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"code":true}' $B/api/chat | tee 出力/砂場答え
          grep -F '{"running":"$ python hello.py"}' 出力/砂場答え
          grep -F '{"tool":{"name":"run","command":"python hello.py","output":"こんにちは\n","code":0}}' 出力/砂場答え
          grep -F '"path":"hello.py"' 出力/砂場答え
          [ "$(cat 出力/作業/1/hello.py)" = "print('こんにちは')" ]
          # 道具の結果がモデルに返り、もう一度答える(偽の Ollama は道具の結果をおうむ返しする)
          [ "$(grep -o '"content":"[^"]*"' 出力/砂場答え | grep -v print | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "書いて動かします。おうむ返し: こんにちは\n\n(終了コード 0)" ]
          docker ps --format '{{.Names}}' | grep -x ohanashi-8092-1
          # 砂場を使わないときは道具を渡さない
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | grep -c running | grep -x 0
          # はじめはネットワークなし。会話の設定でつなぐと、次に砂場を使うときに bridge で作り直す(ファイルは残る)
          [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' ohanashi-8092-1)" = none ]
          curl -s -X PUT -d '{"network":true}' $B/api/conversations/1 | grep -F '"network":true'
          curl -s $B/api/conversations/1 | grep -F '"network":true'
          curl -s -X POST -d '{"conversation":1,"code":true}' $B/api/chat | grep -F '"code":0'
          [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' ohanashi-8092-1)" = bridge ]
          [ -f 出力/作業/1/hello.py ]
          curl -s -X PUT -d '{"title":"題だけ"}' $B/api/conversations/1 | grep -F '"network":true'
          # 会話を消すとコンテナも消える
          curl -s -X DELETE $B/api/conversations/1 | grep -F '{"deleted":true}'
          ! docker ps -a --format '{{.Names}}' | grep -x ohanashi-8092-1
          kill %1 %2
      - name: 起動.sh で、画面から頼んで動かし直す
        run: |
          ./出力/偽Ollama 11438 > 出力/偽Ollama4.log 2>&1 &
          F=$!
          ./起動.sh -- --ollama http://127.0.0.1:11438 --db 出力/起動.db --port 8094 > 出力/起動.log 2>&1 &
          S=$!
          for i in $(seq 300); do curl -s -o /dev/null http://127.0.0.1:8094/ && break; sleep 1; done
          B=http://127.0.0.1:8094
          curl -s $B/api/info | tee 出力/情報1 | grep -F '"restart":true'
          grep -F '"revision":"'"$(git rev-parse --short HEAD)"'"' 出力/情報1
          curl -s -X POST $B/api/restart | grep -F '{"restarting":true}'
          OLD=$(grep -o '"started":[0-9.]*' 出力/情報1)
          NEW=
          for i in $(seq 120); do NEW=$(curl -s $B/api/info | grep -o '"started":[0-9.]*' || true); [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] && break; sleep 1; done
          [ -n "$NEW" ] && [ "$NEW" != "$OLD" ]
          grep -aF '画面から頼まれたので' 出力/起動.log
          # 起動.sh を止めると、アプリも止まる
          kill $S; sleep 3
          ! curl -s -o /dev/null http://127.0.0.1:8094/
          # 起動.sh から動かしていなければ、再起動は頼めない
          ./出力/ohanashi-ollama --ollama http://127.0.0.1:11438 --db 出力/起動.db --port 8097 > 出力/アプリ4.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8097/ && break; sleep 0.2; done
          curl -s http://127.0.0.1:8097/api/info | grep -F '"restart":false'
          curl -s -X POST http://127.0.0.1:8097/api/restart | grep -F '起動.sh から'
          kill $A $F
      - name: 記録を出す(失敗したとき)
        if: failure()
        run: cat 出力/*.log || true
