# kumu 試験・kumu 点検・Markdown の変換と画面の道の試験と、偽の Ollama(偽の web 検索 API も)を相手にアプリ全体を Linux と macOS で動かします。
name: 試験

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: clang と libsqlite3 と OpenSSL を入れる(Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev libssl-dev
      - name: libsqlite3 と OpenSSL の pkg-config を探せるようにする(macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: kumu と suruc を入れる
        # @main は Go のモジュールのプロキシが少し前の main を覚えていることがあるので、GitHub から直接取る
        env:
          GOPROXY: direct
        run: |
          go install github.com/suru-lang/suru/cmd/kumu@main
          go install github.com/suru-lang/suru/cmd/suruc@main
      - name: 試験
        run: ~/go/bin/kumu 試験
      - name: 点検
        run: ~/go/bin/kumu 点検
      - name: Markdown の変換と、画面の道の試験
        run: |
          node 道具/書式試験.js
          node 道具/道試験.js
          node 道具/頁試験.js
          node 道具/通知試験.js
      - name: 偽の Ollama を相手に動かす
        run: |
          ~/go/bin/kumu 作る
          ~/go/bin/suruc 道具/偽Ollama.suru -o 出力/偽Ollama
          ./出力/偽Ollama 11435 > 出力/偽Ollama.log 2>&1 &
          OLLAMA_API_KEY=試し鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11435 --db 出力/試し.db --port 8090 --web-search http://127.0.0.1:11435/api/web_search --no-research > 出力/アプリ.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8090/ && break; sleep 0.2; done
          B=http://127.0.0.1:8090
          curl -s -o /dev/null -w '%{http_code} %{content_type}\n' $B/ | grep -x '200 text/html; charset=utf-8'
          curl -s $B/api/info | grep -F '"version":"0.0.0-偽","web":true'
          curl -s $B/api/models | tee 出力/モデル | grep -F '{"models":["偽","偽-考える","偽-見える","偽-大"],"catalog":[{"name":"偽","capabilities":["completion"],"size":1000000000,"family":"偽族","params":1.5,"quantization":"Q4_K_M","context":4096,"summary":"","scores":null,'
          grep -F '{"name":"偽-大","capabilities":["completion","tools"],' 出力/モデル
          grep -F '"recommended":{"会話":{"name":"偽-大","reason":"点数がまだないので、一番大きいモデル"},"コーディング":{"name":"偽-大",' 出力/モデル
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations | grep -F '"id":1'
          curl -s -X POST -d '{"role":"user","content":"やあ"}' $B/api/conversations/1/messages | grep -F '"title":"やあ"'
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | tee 出力/答え
          grep -F '{"stats":{"tokens":12,"seconds":0.5,"prompt":32}}' 出力/答え
          [ "$(grep -o '"content":"[^"]*"' 出力/答え | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "おうむ返し: やあ" ]
          curl -s -X POST -d '{"role":"assistant","content":"おうむ返し: やあ"}' $B/api/conversations/1/messages | grep -F '{"role":"assistant","content":"おうむ返し: やあ"}'
          curl -s $B/api/conversations | grep -F '"title":"やあ"'
          curl -s -X POST -d '{"q":"やあ"}' $B/api/search | grep -F '"snippet":"やあ"'
          curl -s -X POST -d '{"q":"ない言葉"}' $B/api/search | grep -x '\[\]'
          # ウェブ検索: 先に出典が届き、モデルには検索の結果が渡る(偽の Ollama は「 [検索あり]」を付ける)
          curl -s -X POST -d '{"role":"user","content":"天気"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"web":true}' $B/api/chat | tee 出力/検索答え
          head -1 出力/検索答え | grep -F '{"sources":[{"title":"天気 の結果 1","url":"https://example.com/1"}'
          [ "$(grep -o '"content":"[^"]*"' 出力/検索答え | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "おうむ返し: 天気 [検索あり]" ]
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | grep -c sources | grep -x 0
          # SearXNG: 問いを URL に符号化して送り、はじめの5つを使う(偽の SearXNG は6つ返す)
          ./出力/ohanashi-ollama --ollama http://127.0.0.1:11435 --db 出力/試し.db --port 8091 --searxng http://127.0.0.1:11435/ --no-research > 出力/アプリ2.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8091/ && break; sleep 0.2; done
          curl -s http://127.0.0.1:8091/api/info | grep -F '"web":true'
          curl -s -X POST -d '{"conversation":1,"web":true}' http://127.0.0.1:8091/api/chat | tee 出力/SearXNG答え
          head -1 出力/SearXNG答え | grep -F '{"sources":[{"title":"%E5%A4%A9%E6%B0%97 の結果 1"'
          [ "$(head -1 出力/SearXNG答え | grep -o '"url"' | wc -l | tr -d ' ')" = 5 ]
          [ "$(grep -o '"content":"[^"]*"' 出力/SearXNG答え | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "おうむ返し: 天気 [検索あり]" ]
          kill %3
          curl -s -o /dev/null -w '%{http_code}\n' -H 'Origin: http://evil.example' $B/api/conversations | grep -x 403
          curl -s -X PUT -d '{"model":"ない"}' $B/api/conversations/1 > /dev/null
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | grep -F "{\"error\":\"Ollama: model 'ない' not found"
          node -e '
            const ws = new WebSocket("ws://127.0.0.1:8090/ws"); const got = [];
            const t = setTimeout(() => { console.error("時間切れ", got); process.exit(1); }, 10000);
            const 開いた = new Promise((r) => (ws.onopen = r));
            const 変えた = fetch("http://127.0.0.1:8090/api/conversations/1", { method: "PUT", body: JSON.stringify({ model: "偽-考える" }) });
            Promise.all([開いた, 変えた]).then(() => ws.send(JSON.stringify({ conversation: 1 })));
            ws.onmessage = (e) => { got.push(JSON.parse(e.data)); if (got.at(-1).done) ws.close(); };
            ws.onclose = () => {
              clearTimeout(t);
              const 答え = got.map((g) => g.content || "").join(""), 考え = got.map((g) => g.thinking || "").join("");
              console.log(答え, 考え);
              process.exit(答え.startsWith("おうむ返し: ") && 考え === "ふむふむ" ? 0 : 1);
            };'
          # スレッド: 会話の設定(指示)は全部のスレッドに効き、モデルにはそのスレッドの発言だけが届く
          curl -s -X PUT -d '{"model":"偽","system":"短く"}' $B/api/conversations/1 > /dev/null
          curl -s $B/api/conversations/1 | grep -F '"threads":[{"id":1,"title":"やあ"'
          curl -s -X POST -d '{}' $B/api/conversations/1/threads | tee 出力/スレッド | grep -F '"conversation":1,"title":"","messages":[]'
          T=$(sed 's/^{"id":\([0-9]*\),.*/\1/' 出力/スレッド)
          curl -s -X POST -d '{"role":"user","content":"発言の数は"}' $B/api/threads/$T/messages | grep -F '"title":"発言の数は"'
          curl -s -X POST -d "{\"thread\":$T}" $B/api/chat | tee 出力/スレッド答え
          [ "$(grep -o '"content":"[^"]*"' 出力/スレッド答え | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "おうむ返し: 発言の数は [指示: 短く] [問い 1]" ]
          # 前の道({"conversation":番号}・/messages)は一番新しいスレッドのこと
          curl -s -X POST -d '{"role":"assistant","content":"答え"}' $B/api/conversations/1/messages | grep -F '"messages":[{"role":"user","content":"発言の数は"},{"role":"assistant","content":"答え"}]'
          curl -s -X POST -d '{"role":"user","content":"発言の数は?"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1}' $B/api/chat > 出力/スレッド答え2
          grep -o '"content":"[^"]*"' 出力/スレッド答え2 | sed 's/"content":"//; s/"$//' | tr -d '\n' | grep -F '[問い 2]'
          curl -s -X DELETE $B/api/threads/$T/last-answer | grep -F '"content":"発言の数は?"}]}'
          curl -s -X PUT -d '{"title":"二つ目"}' $B/api/threads/$T | grep -F '"title":"二つ目"'
          curl -s -X POST -d '{"q":"発言の数"}' $B/api/search | grep -F "\"thread\":$T,"
          curl -s $B/api/conversations | grep -F '"threads":2'
          curl -s -X DELETE $B/api/threads/$T | grep -F '{"deleted":true}'
          # スレッドのまとめ: 発言のあとにまとめの問いを足して流す(しまわない)
          curl -s -X POST -d '{"conversation":1,"summary":true}' $B/api/chat > 出力/まとめ
          [ "$(grep -o '"content":"[^"]*"' 出力/まとめ | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "まとめ: 発言 4 個 [指示: 短く]" ]
          curl -s $B/api/threads/1 | grep -c 'まとめ' | grep -x 0
          # 会話のメモは、どのスレッドでも指示のあとに届く
          curl -s -X PUT -d '{"memo":"枝は ohanashi/x"}' $B/api/conversations/1 | grep -F '"memo":"枝は ohanashi/x"'
          curl -s -o /dev/null -w '%{http_code}\n' -X PUT -d "{\"memo\":\"$(printf 'あ%.0s' $(seq 8001))\"}" $B/api/conversations/1 | grep -x 400
          curl -s -X POST -d '{"role":"user","content":"メモは"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1}' $B/api/chat > 出力/メモ答え
          grep -o '"content":"[^"]*"' 出力/メモ答え | sed 's/"content":"//; s/"$//' | tr -d '\n' | grep -F '[指示: 短く\n\n## これまでのスレッドで分かったこと\n\n枝は ohanashi/x]'
          # 決まり: はじめに見本が1つある。会話に付けると、見出しを付けて指示の前に届く。直すと次の答えから効く
          curl -s $B/api/rules | grep -F '[{"id":1,"name":"コードを書くときの決まり","default":false,'
          curl -s -X POST -d '{"name":"敬語","content":"です・ます で答える"}' $B/api/rules | grep -F '{"id":2,"name":"敬語","content":"です・ます で答える","default":false,"scene":""}'
          curl -s -o /dev/null -w '%{http_code}\n' -X POST -d '{"name":" ","content":"x"}' $B/api/rules | grep -x 400
          curl -s -X PUT -d '{"rules":[2]}' $B/api/conversations/1 | grep -F '"rules":[2]'
          curl -s -X POST -d '{"role":"user","content":"決まりは"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1}' $B/api/chat > 出力/決まり答え
          grep -o '"content":"[^"]*"' 出力/決まり答え | sed 's/"content":"//; s/"$//' | tr -d '\n' | grep -F '[指示: # 決まり: 敬語\nです・ます で答える\n\n# この会話の指示\n短く\n\n## これまでのスレッドで分かったこと\n\n枝は ohanashi/x]'
          curl -s -X PUT -d '{"content":"丁寧に"}' $B/api/rules/2 | grep -F '"content":"丁寧に"'
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | grep -o '"content":"[^"]*"' | sed 's/"content":"//; s/"$//' | tr -d '\n' | grep -F '[指示: # 決まり: 敬語\n丁寧に\n\n'
          curl -s $B/api/rules | grep -F '"name":"敬語","default":false,"length":3,'
          # 既定の決まりは新しい会話に付く。決まりを消すと会話から外れる
          curl -s -X PUT -d '{"default":true}' $B/api/rules/2 | grep -F '"default":true'
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations | grep -F '"rules":[2]'
          curl -s -X DELETE $B/api/rules/2 | grep -F '{"deleted":true}'
          curl -s $B/api/conversations/1 | grep -F '"rules":[]'
          curl -s -o /dev/null -w '%{http_code}\n' $B/api/rules/2 | grep -x 404
          curl -s -o /dev/null -w '%{http_code}\n' -X DELETE $B/api/threads/1 | grep -x 404
          curl -s -o /dev/null -w '%{http_code}\n' $B/api/threads/999 | grep -x 404
          curl -s -X POST -d '{"thread":999}' $B/api/chat | grep -F '{"error":"その会話かスレッドはありません"}'
          # 添付: 画像は images で、文書は問いの前に <file> で囲んで届く。スレッドには目録だけ、中身は /api/attachments から
          T2=$(curl -s -X POST -d '{}' $B/api/conversations/1/threads | sed 's/^{"id":\([0-9]*\),.*/\1/')
          PNG=$(printf '\211PNG\r\n\032\n' | base64)
          curl -s -X POST -d "{\"role\":\"user\",\"content\":\"これは何\",\"attachments\":[{\"kind\":\"image\",\"name\":\"点.png\",\"type\":\"image/png\",\"data\":\"$PNG\"},{\"kind\":\"text\",\"name\":\"メ\\\"モ<.txt\",\"type\":\"text/plain\",\"text\":\"りんご\",\"pages\":0}]}" $B/api/threads/$T2/messages | tee 出力/添付スレッド
          grep -F '"content":"これは何","attachments":[{"id":1,"kind":"image","name":"点.png","type":"image/png","pages":0,"chars":0},{"id":2,"kind":"text","name":"メモ.txt","type":"text/plain","pages":0,"chars":3}]' 出力/添付スレッド
          # 画像を読めないモデル(偽)には送らない。読めるモデル(偽-見える)に変えると届く
          curl -s -X POST -d "{\"thread\":$T2}" $B/api/chat | grep -F '{"error":"このモデル(偽)は画像を読めません。画像を読めるモデル(qwen2.5vl・gemma3 など)に変えてください"}'
          curl -s -X PUT -d '{"model":"偽-見える"}' $B/api/conversations/1 | grep -F '"model":"偽-見える"'
          curl -s -X POST -d "{\"thread\":$T2}" $B/api/chat > 出力/添付答え
          node -e 'const t = require("fs").readFileSync("出力/添付答え", "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l).content || "").join(""); if (!t.startsWith("おうむ返し: <file name=\"メモ.txt\">\nりんご\n</file>\n\nこれは何 [指示: ") || !t.endsWith("] [画像 1 枚]")) { console.error(t); process.exit(1); }'
          curl -s -o /dev/null -w '%{http_code} %{content_type}\n' $B/api/attachments/1 | grep -x '200 image/png'
          [ "$(curl -s $B/api/attachments/2)" = りんご ]
          # 読めないモデルに戻すと、前の画像は外して「(画像: 名前)」と書き添える
          curl -s -o /dev/null -X POST -d '{"role":"assistant","content":"点です"}' $B/api/threads/$T2/messages
          curl -s -o /dev/null -X POST -d '{"role":"user","content":"ありがとう"}' $B/api/threads/$T2/messages
          curl -s -X PUT -d '{"model":"偽"}' $B/api/conversations/1 | grep -F '"model":"偽"'
          curl -s -X POST -d "{\"thread\":$T2}" $B/api/chat > 出力/添付答え2
          node -e 'const t = require("fs").readFileSync("出力/添付答え2", "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l).content || "").join(""); if (!t.startsWith("おうむ返し: ありがとう") || t.includes("[画像")) { console.error(t); process.exit(1); }'
          curl -s -o /dev/null -w '%{http_code}\n' $B/api/attachments/99 | grep -x 404
          # 添付だけの問いは、添付の名前が題になる。gif・読めない base64・答えへの添付は断る
          T3=$(curl -s -X POST -d '{}' $B/api/conversations/1/threads | sed 's/^{"id":\([0-9]*\),.*/\1/')
          curl -s -X POST -d "{\"role\":\"user\",\"content\":\"\",\"attachments\":[{\"kind\":\"image\",\"name\":\"写真.jpg\",\"type\":\"image/jpeg\",\"data\":\"$PNG\"}]}" $B/api/threads/$T3/messages | grep -F '"title":"写真.jpg"'
          curl -s -X POST -d '{"role":"user","content":"x","attachments":[{"kind":"image","name":"a.gif","type":"image/gif","data":"AAAA"}]}' $B/api/threads/$T3/messages | grep -F '{"error":"画像は PNG か JPEG で送ってください(a.gif は image/gif)"}'
          curl -s -o /dev/null -w '%{http_code}\n' -X POST -d '{"role":"user","content":"x","attachments":[{"kind":"image","name":"a","type":"image/png","data":"!!"}]}' $B/api/threads/$T3/messages | grep -x 400
          curl -s -X POST -d '{"role":"assistant","content":"x","attachments":[{"kind":"text","name":"a","text":"b"}]}' $B/api/threads/$T3/messages | grep -F '{"error":"添付は問い(role が user)にだけ付けられます"}'
          curl -s -X DELETE $B/api/conversations/1 | grep -F '{"deleted":true}'
          # 会話を消すと添付も消える
          curl -s -o /dev/null -w '%{http_code}\n' $B/api/attachments/1 | grep -x 404
          kill %1 %2
      - name: モードと、モデル帳(調べもの・おすすめ・手直し)
        run: |
          ./出力/偽Ollama 11435 > 出力/偽Ollama2.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:11435/api/version && break; sleep 0.2; done
          # 調べ役に貧弱な 偽(1.5B)を指名すると、道具を使える大きな 偽-大 で調べ直す
          ./出力/ohanashi-ollama --ollama http://127.0.0.1:11435 --db 出力/帳.db --port 8092 --searxng http://127.0.0.1:11435/ --research-model 偽 > 出力/アプリ帳.log 2>&1 &
          B=http://127.0.0.1:8092
          for i in $(seq 100); do grep -q '調べ終わりました' 出力/アプリ帳.log && break; sleep 0.2; done
          cat 出力/アプリ帳.log
          grep -F 'モデル帳: 偽 で調べた結果が貧弱なので、偽-大 で調べ直しています。' 出力/アプリ帳.log
          curl -s $B/api/models | tee 出力/帳モデル
          grep -F '"summary":"偽-大 が調べた 偽-見える","scores":{"coding":1,"chat":5,"japanese":4,"reasoning":2},"notes":"検索あり","researcher":"偽-大",' 出力/帳モデル
          grep -F '"recommended":{"会話":{"name":"偽-見える","reason":"会話の点数 5・日本語 4"},"コーディング":{"name":"偽-大","reason":"コードの点数 5・日本語 4・道具を使える"}}' 出力/帳モデル
          curl -s $B/api/info | grep -F '"catalog":{"state":"","done":4,"total":4,"researcher":"偽-大"'
          # 手で直したものは、調べ直しても書きかえない
          curl -s -X PUT -d '{"name":"偽","summary":"手で直した","scores":{"coding":2,"chat":2,"japanese":2,"reasoning":2},"notes":"","manual":true}' $B/api/models | grep -F '"summary":"手で直した","scores":{"coding":2,"chat":2,"japanese":2,"reasoning":2},"notes":"","researcher":"偽-大",'
          curl -s -o /dev/null -w '%{http_code}\n' -X PUT -d '{"name":"ない","summary":"x","scores":{"coding":1,"chat":1,"japanese":1,"reasoning":1}}' $B/api/models | grep -x 404
          curl -s -o /dev/null -w '%{http_code}\n' -X PUT -d '{"name":"偽","summary":"x","scores":{"coding":9}}' $B/api/models | grep -x 400
          curl -s -X POST -d '{}' $B/api/models/research | grep -F '{"research":true}'
          for i in $(seq 100); do [ "$(grep -c '調べ終わりました' 出力/アプリ帳.log)" = 2 ] && break; sleep 0.2; done
          curl -s $B/api/models | grep -F '"summary":"手で直した",'
          # モデルを省いて会話を作ると、モードのおすすめになる。コーディングにすると場面がコーディングの決まりが付き、会話に戻すと外れる
          curl -s $B/api/rules | grep -F '"scene":"コーディング"}]'
          curl -s -X POST -d '{"mode":"コーディング"}' $B/api/conversations | tee 出力/モード | grep -F '"model":"偽-大",'
          grep -F '"rules":[1],' 出力/モード
          grep -F '"mode":"コーディング"' 出力/モード
          curl -s -X POST -d '{}' $B/api/conversations | grep -F '"model":"偽-見える",'
          curl -s -X PUT -d '{"mode":"会話"}' $B/api/conversations/1 | grep -F '"rules":[],'
          curl -s -X PUT -d '{"mode":"コーディング"}' $B/api/conversations/2 | grep -F '"rules":[1],'
          # 場面「いつも」の決まりは既定の決まり(新しい会話に付く)
          curl -s -X POST -d '{"name":"短く","content":"短く答える","scene":"いつも"}' $B/api/rules | grep -F '"default":true,"scene":"いつも"}'
          curl -s -X POST -d '{"mode":"会話","model":"偽"}' $B/api/conversations | grep -F '"model":"偽",' | grep -F '"rules":[2],'
          kill %1 %2

      - name: 偽の GitHub を相手に、会話のリポジトリを読む
        run: |
          ./出力/偽Ollama 11436 > 出力/偽Ollama5.log 2>&1 &
          F=$!
          GITHUB_TOKEN=試し鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11436 --db 出力/GitHub.db --port 8093 --github-api http://127.0.0.1:11436 --github-repos o/r,p/* > 出力/アプリ5.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8093/ && break; sleep 0.2; done
          B=http://127.0.0.1:8093
          grep -F 'GitHub: 試し としてつながりました。会話に足せるリポジトリ: o/r,p/*' 出力/アプリ5.log
          # 足すときの候補は、鍵で使えるリポジトリのうち --github-repos に入るもの
          curl -s $B/api/github/repos | grep -xF '{"repos":["o/r","p/Tools"]}'
          if grep -F '試し鍵' 出力/アプリ5.log; then exit 1; fi
          curl -s $B/api/info | grep -F '"github":true,"githubRepos":["o/r","p/*"],"githubUser":"試し"'
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations | grep -F '"repos":[]'
          # 許していないリポジトリ(x/y)は残らない。大文字小文字は書いたまま
          curl -s -X PUT -d '{"repos":[{"repo":"o/r"},{"repo":"x/y","write":true},{"repo":"p/Tools","write":true}]}' $B/api/conversations/1 | grep -F '"repos":[{"repo":"o/r","write":false},{"repo":"p/Tools","write":true}]'
          curl -s -X POST -d '{"role":"user","content":"GitHub の README を読んで"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"github":true}' $B/api/chat | tee 出力/GitHub答え
          grep -F '{"running":"🐙 o/r の README.md を読んでいます"}' 出力/GitHub答え
          grep -F '{"tool":{"name":"github_file","summary":"🐙 o/r の README.md を読みました(2 行)"}}' 出力/GitHub答え
          # 読んだ中身がモデルに返り、もう一度答える(偽の Ollama は道具の結果をおうむ返しする)
          [ "$(grep -o '"content":"[^"]*"' 出力/GitHub答え | sed 's/"content":"//; s/"$//' | tr -d '\n')" = '読みます。おうむ返し: # 試し\nこんにちは\n' ]
          # 🐙 を押していなければ道具を渡さない
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | grep -c running | grep -x 0
          # リポジトリのない会話では知らせる
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations > /dev/null
          curl -s -X POST -d '{"role":"user","content":"GitHub"}' $B/api/conversations/2/messages > /dev/null
          curl -s -X POST -d '{"conversation":2,"github":true}' $B/api/chat | grep -F '{"notice":"この会話には GitHub のリポジトリがありません。⚙ の設定で足してください"}'
          kill $A
          # --github-repos がなくても、鍵があれば使える。会話には、どのリポジトリでも足せる
          GITHUB_TOKEN=試し鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11436 --db 出力/GitHub2.db --port 8101 --github-api http://127.0.0.1:11436 > 出力/アプリ9.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8101/ && break; sleep 0.2; done
          grep -F 'GitHub: 試し としてつながりました。会話に足せるリポジトリ: 鍵で使えるものはどれでも' 出力/アプリ9.log
          curl -s http://127.0.0.1:8101/api/info | grep -F '"github":true,"githubRepos":[],"githubUser":"試し"'
          curl -s http://127.0.0.1:8101/api/github/repos | grep -xF '{"repos":["o/r","x/y","p/Tools"]}'
          curl -s -X POST -d '{"model":"偽"}' http://127.0.0.1:8101/api/conversations > /dev/null
          curl -s -X PUT -d '{"repos":[{"repo":"x/y","write":true},{"repo":"bad"}]}' http://127.0.0.1:8101/api/conversations/1 | grep -F '"repos":[{"repo":"x/y","write":true}]'
          kill $A
          # 鍵が違えば、起動のときに知らせる(鍵は出さない)
          GITHUB_TOKEN=違う鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11436 --db 出力/GitHub.db --port 8098 --github-api http://127.0.0.1:11436 --github-repos o/r > 出力/アプリ6.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8098/ && break; sleep 0.2; done
          grep -F '注意: GitHub の鍵を確かめられませんでした(GitHub の鍵が違うか、期限が切れています(401): Bad credentials)。' 出力/アプリ6.log
          if grep -F '違う鍵' 出力/アプリ6.log; then exit 1; fi
          curl -s http://127.0.0.1:8098/api/info | grep -F '"github":true,"githubRepos":["o/r"],"githubUser":""'
          kill $A $F
      - name: 偽の GitHub を相手に、読み書きのリポジトリに issue を書く
        run: |
          ./出力/偽Ollama 11439 > 出力/偽Ollama7.log 2>&1 &
          F=$!
          GITHUB_TOKEN=試し鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11439 --db 出力/GitHub書.db --port 8099 --github-api http://127.0.0.1:11439 --github-repos o/r,p/* > 出力/アプリ7.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8099/ && break; sleep 0.2; done
          B=http://127.0.0.1:8099
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations > /dev/null
          # 読むだけの o/r には書かない(書く道具は、読み書きの p/tools のために渡している)
          curl -s -X PUT -d '{"repos":[{"repo":"o/r"},{"repo":"p/tools","write":true}]}' $B/api/conversations/1 > /dev/null
          curl -s -X POST -d '{"role":"user","content":"GitHub に issue を作って"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"github":true}' $B/api/chat | tee 出力/書答え1
          grep -F '{"running":"🐙 o/r に issue を作っています"}' 出力/書答え1
          grep -F '"summary":"🐙 書けませんでした: o/r は、この会話では読むだけです。' 出力/書答え1
          # 読み書きなら書く。本文の終わりに、書いたモデルを付ける
          curl -s -X PUT -d '{"repos":[{"repo":"o/r","write":true}]}' $B/api/conversations/1 > /dev/null
          curl -s -X POST -d '{"conversation":1,"github":true}' $B/api/chat | tee 出力/書答え2
          grep -F '{"tool":{"name":"github_issue","summary":"🐙 o/r に issue [#7](https://github.com/o/r/issues/7) を作りました: 試しの issue"}}' 出力/書答え2
          grep -o '"content":"[^"]*"' 出力/書答え2 | sed 's/"content":"//; s/"$//' | tr -d '\n' > 出力/書答え2.文
          grep -F 'created #7: https://github.com/o/r/issues/7' 出力/書答え2.文
          # 偽の GitHub は届いた本文を title に入れて返す(「"」は上の取り出しで消える)
          grep -F 'title\:\試しの issue\,\body\:\動きません\\n\\n— ohanashi-ollama(偽) で書きました\,\labels\:[\bug\]' 出力/書答え2.文
          curl -s -X POST -d '{"role":"user","content":"GitHub の issue を閉じて"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"github":true}' $B/api/chat | tee 出力/書答え3
          grep -F '{"tool":{"name":"github_issue","summary":"🐙 o/r の [#1](https://github.com/o/r/issues/1) を閉じました(予定なし)"}}' 出力/書答え3
          kill $A $F
      - name: 砂場(Docker)でコードを動かす(Linux)
        # macOS の GitHub の機械には Docker がないので Linux だけで。偽の Ollama は「コード」を含む問いに、hello.py を書いて動かす道具を呼ぶ
        if: runner.os == 'Linux'
        run: |
          ./出力/偽Ollama 11435 > 出力/偽Ollama.log 2>&1 &
          ./出力/ohanashi-ollama --ollama http://127.0.0.1:11435 --db 出力/砂場.db --port 8092 --work 出力/作業 > 出力/アプリ3.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8092/ && break; sleep 0.2; done
          B=http://127.0.0.1:8092
          grep -F '砂場: Docker' 出力/アプリ3.log
          curl -s $B/api/info | grep -F '"sandbox":true'
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations | grep -F '"id":1'
          curl -s -X POST -d '{"role":"user","content":"コードを書いて"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"code":true}' $B/api/chat | tee 出力/砂場答え
          grep -F '{"running":"$ python hello.py"}' 出力/砂場答え
          grep -F '{"tool":{"name":"run","command":"python hello.py","output":"こんにちは\n","code":0}}' 出力/砂場答え
          grep -F '"path":"hello.py"' 出力/砂場答え
          [ "$(cat 出力/作業/1/hello.py)" = "print('こんにちは')" ]
          # 答えの中でできたファイルは、終わりに {"files":…} で知らせる。ohanashi-sandbox がないので、文書の道具は渡さない
          grep -F '{"files":[{"path":"hello.py","size":25}]}' 出力/砂場答え
          grep -F 'docker build -t ohanashi-sandbox 砂場' 出力/アプリ3.log
          curl -s $B/api/info | grep -F '"documents":false'
          # 道具の結果がモデルに返り、もう一度答える(偽の Ollama は道具の結果をおうむ返しする)
          [ "$(grep -o '"content":"[^"]*"' 出力/砂場答え | grep -v print | sed 's/"content":"//; s/"$//' | tr -d '\n')" = "書いて動かします。おうむ返し: こんにちは\n\n(終了コード 0)" ]
          docker ps --format '{{.Names}}' | grep -x ohanashi-8092-1
          # 砂場を使わないときは道具を渡さない
          curl -s -X POST -d '{"conversation":1}' $B/api/chat | grep -c running | grep -x 0
          # はじめはネットワークなし。会話の設定でつなぐと、次に砂場を使うときに bridge で作り直す(ファイルは残る)
          [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' ohanashi-8092-1)" = none ]
          curl -s -X PUT -d '{"network":true}' $B/api/conversations/1 | grep -F '"network":true'
          curl -s $B/api/conversations/1 | grep -F '"network":true'
          curl -s -X POST -d '{"conversation":1,"code":true}' $B/api/chat | grep -F '"code":0'
          [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' ohanashi-8092-1)" = bridge ]
          [ -f 出力/作業/1/hello.py ]
          curl -s -X PUT -d '{"title":"題だけ"}' $B/api/conversations/1 | grep -F '"network":true'
          # リポジトリの決まりのファイル: 答えの途中で砂場に作られたら、読み直してモデルに渡す。次の答えからは指示の頭に入る
          curl -s -X POST -d '{"role":"user","content":"決まりを置いて"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"code":true}' $B/api/chat | tee 出力/決まり置き
          grep -F '{"notice":"リポジトリの決まりを読みました: q/OHANASHI.md"}' 出力/決まり置き
          grep -o '"content":"[^"]*"' 出力/決まり置き | sed 's/"content":"//; s/"$//' | tr -d '\n' | grep -F 'おうむ返し: 作業フォルダのリポジトリに、次の決まりがあります。これに従ってください。\n\n# リポジトリ q の決まり(/work/q/OHANASHI.md)\nQ の決まり'
          curl -s -X POST -d '{"role":"user","content":"次は"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"code":true}' $B/api/chat > 出力/決まり次
          grep -o '"content":"[^"]*"' 出力/決まり次 | sed 's/"content":"//; s/"$//' | tr -d '\n' | grep -F 'おうむ返し: 次は [指示: # リポジトリ q の決まり(/work/q/OHANASHI.md)\nQ の決まり]'
          # 作業フォルダのファイル: 一覧(clone したリポジトリはフォルダの名前だけ)と中身。外は 403、隠しは 404、ほかのサイトからは 403
          curl -s -X POST -d '{"role":"user","content":"ファイルを書いて"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"code":true}' $B/api/chat | tee 出力/ファイル答え
          grep -F '{"files":[{"path":"出力/a (1).txt","size":4}]}' 出力/ファイル答え
          curl -s $B/api/conversations/1/files | tee 出力/ファイル一覧
          grep -F '{"path":"hello.py","size":25,' 出力/ファイル一覧
          grep -F '{"path":"q","size":0,' 出力/ファイル一覧
          grep -F '"path":"出力/a (1).txt","size":4,' 出力/ファイル一覧
          ! grep -F 'OHANASHI.md' 出力/ファイル一覧
          [ "$(curl -s "$B/api/conversations/1/files/%E5%87%BA%E5%8A%9B/a%20%281%29.txt")" = "あ" ]
          curl -s -D - -o /dev/null $B/api/conversations/1/files/hello.py | tee 出力/ファイル見出し
          grep -F "Content-Disposition: attachment; filename*=UTF-8''hello.py" 出力/ファイル見出し
          grep -F 'Content-Security-Policy: sandbox' 出力/ファイル見出し
          [ "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is $B/api/conversations/1/files/%2E%2E/%2E%2E/砂場.db)" = 403 ]
          ln -s /etc/passwd 出力/作業/1/外
          [ "$(curl -s -o /dev/null -w '%{http_code}' $B/api/conversations/1/files/%E5%A4%96)" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' $B/api/conversations/1/files/q/.git)" = 404 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: http://evil.example' $B/api/conversations/1/files)" = 403 ]
          # 道具を使わずに「作成しました」と書くと、一度だけ頼み直す(文書の道具がないので、偽の Ollama はまだ作っていないと答える)
          curl -s -X POST -d '{"role":"user","content":"作ったふりをして"}' $B/api/conversations/1/messages > /dev/null
          curl -s -X POST -d '{"conversation":1,"code":true}' $B/api/chat | tee 出力/ふり答え
          grep -F '{"notice":"⚠ モデルがファイルを作ったと書きましたが、作業フォルダにファイルができていないので、道具で作るように頼み直しています…"}' 出力/ふり答え
          grep -F '"content":"すみません、まだ作っていません"' 出力/ふり答え
          ! grep -F 'ファイルはできていません' 出力/ふり答え
          # 会話を消すとコンテナも消える
          curl -s -X DELETE $B/api/conversations/1 | grep -F '{"deleted":true}'
          ! docker ps -a --format '{{.Names}}' | grep -x ohanashi-8092-1
          kill %1 %2
      - name: 砂場に GitHub のリポジトリを clone して、変えたものを push し、PR を作る(Linux)
        # clone と push は手元の裸のリポジトリ(file://)、PR は偽の GitHub が相手
        if: runner.os == 'Linux'
        run: |
          rm -rf 出力/裸 出力/種 出力/作業G 出力/GitHub作業.db
          git init -q --bare --initial-branch=main 出力/裸/o/r.git
          git init -q --bare --initial-branch=main 出力/裸/o/empty.git
          git clone -q 出力/裸/o/r.git 出力/種
          printf '# 試し\n' > 出力/種/README.md
          git -C 出力/種 add README.md
          git -C 出力/種 -c user.name=t -c user.email=t@example.com commit -q -m 初め
          git -C 出力/種 push -q origin HEAD:main
          ./出力/偽Ollama 11440 > 出力/偽Ollama8.log 2>&1 &
          F=$!
          GITHUB_TOKEN=試し鍵 ./出力/ohanashi-ollama --ollama http://127.0.0.1:11440 --db 出力/GitHub作業.db --port 8100 --work 出力/作業G --sandbox-image python:3.12-slim --github-api http://127.0.0.1:11440 --github-git "file://$PWD/出力/裸" --github-repos o/r,o/empty > 出力/アプリ8.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8100/ && break; sleep 0.2; done
          B=http://127.0.0.1:8100
          話す() { curl -s -X POST -d "{\"role\":\"user\",\"content\":\"$1\"}" $B/api/conversations/1/messages > /dev/null; curl -s -X POST -d '{"conversation":1,"code":true,"github":true}' $B/api/chat; }
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations > /dev/null
          curl -s -X PUT -d '{"repos":[{"repo":"o/r","write":true}]}' $B/api/conversations/1 > /dev/null
          # clone はサーバーが行い、コンテナの /work から見える。鍵は .git/config にも鍵場にも残らない
          話す 'o/r を clone して' | tee 出力/git答え1
          grep -F '{"running":"🐙 o/r を clone しています"}' 出力/git答え1
          grep -F '"summary":"🐙 o/r を /work/r に clone しました(枝 main)"' 出力/git答え1
          [ "$(git -C 出力/作業G/1/r config user.name)" = 試し ]
          [ "$(git -C 出力/作業G/1/r config user.email)" = 試し@users.noreply.github.com ]
          if grep -rF 試し鍵 出力/作業G; then exit 1; fi
          [ -z "$(ls -A 出力/作業G/.鍵)" ]
          docker exec ohanashi-8100-1 cat /work/r/README.md | grep -x '# 試し'
          printf 'こんにちは\n' >> 出力/作業G/1/r/README.md
          # 既定の枝には push しない
          話す 'main に push して' | tee 出力/git答え2m | grep -F '"summary":"🐙 書けませんでした: 既定の枝(main)には push しません。'
          # 失敗した push の結果には、やり直すようにモデルへの指示を添える(偽の Ollama はおうむ返しする)
          grep -o '"content":"[^"]*"' 出力/git答え2m | sed 's/"content":"//; s/"$//' | tr -d '\n' | grep -F 'The push did not happen.'
          # 新しい枝に commit して push する。commit の文の終わりに、書いたモデルを付ける
          話す 'push して' | tee 出力/git答え2
          grep -F '{"running":"🐙 o/r の枝 ohanashi/test に push しています"}' 出力/git答え2
          # できた push の結果には、github_tree で確かめるようにモデルへの指示を添える
          grep -o '"content":"[^"]*"' 出力/git答え2 | sed 's/"content":"//; s/"$//' | tr -d '\n' | grep -F 'call github_tree with this repo'
          grep -F '"summary":"🐙 o/r の枝 ohanashi/test に push しました(' 出力/git答え2
          [ "$(git --git-dir 出力/裸/o/r.git log -1 --format='%an <%ae>|%s' ohanashi/test)" = '試し <試し@users.noreply.github.com>|README を直す' ]
          git --git-dir 出力/裸/o/r.git log -1 --format=%B ohanashi/test | grep -xF '— ohanashi-ollama(偽) で書きました'
          [ "$(git --git-dir 出力/裸/o/r.git show ohanashi/test:README.md | tail -n 1)" = こんにちは ]
          [ "$(git --git-dir 出力/裸/o/r.git rev-parse main)" = "$(git -C 出力/種 rev-parse HEAD)" ]
          [ -z "$(ls -A 出力/作業G/.鍵)" ]
          話す 'push して' | grep -F '"summary":"🐙 書けませんでした: push する変更がありません。'
          # run で git push しても、サーバーが代わりに push する(コンテナには鍵がない)
          printf '2行目\n' >> 出力/作業G/1/r/README.md
          話す 'git push して' | grep -F '"summary":"🐙 o/r の枝 ohanashi/test2 に push しました('
          [ "$(git --git-dir 出力/裸/o/r.git show ohanashi/test2:README.md | tail -n 1)" = 2行目 ]
          [ "$(git --git-dir 出力/裸/o/r.git log -1 --format=%s ohanashi/test2)" = 'ohanashi-ollama で変えたもの' ]
          # PR を作る(偽の GitHub は、届いた本文を title に入れて返す)
          話す 'PR を作って' | tee 出力/git答え3
          grep -F '"summary":"🐙 o/r に PR [#12](https://github.com/o/r/pull/12) を作りました: README を直す(ohanashi/test → main)"' 出力/git答え3
          grep -o '"content":"[^"]*"' 出力/git答え3 | sed 's/"content":"//; s/"$//' | tr -d '\n' > 出力/git答え3.文
          grep -F 'head\:\ohanashi/test\' 出力/git答え3.文
          grep -F 'base\:\main\' 出力/git答え3.文
          grep -F '直しました\\n\\n— ohanashi-ollama(偽) で書きました' 出力/git答え3.文
          grep -F 'call github_issues with kind pr' 出力/git答え3.文
          # PR を作れていれば、作れていないという知らせは出さない
          if grep -F 'PR を作れていません' 出力/git答え3; then exit 1; fi
          # 道具を使わずに PR を作ったと答えたら、確かめてやり直すように頼み直す
          話す 'PR を作ったと言って' | tee 出力/git答え4
          grep -F 'Pull Request #2' 出力/git答え4
          grep -F '"notice":"⚠ モデルが『できた』と書きましたが' 出力/git答え4
          grep -F '"content":"すみません、まだ PR を作っていません"' 出力/git答え4
          if grep -F 'PR を作れていません' 出力/git答え4; then exit 1; fi
          # 道具の呼び出しを文で書いただけのときも、頼み直す
          話す '道具を文で書いて' | tee 出力/git答え8
          grep -F 'github_push repo=o/r' 出力/git答え8
          grep -F '"notice":"⚠ モデルが道具を使わずに、使ったように書いたので' 出力/git答え8
          grep -F '"content":"すみません' 出力/git答え8
          # 2回頼み直しても、道具を使わずにできたと答えたら、できていないと知らせる
          # 2回頼み直しても道具の呼び出しを文で書いたままなら、道具は動いていないと知らせる
          話す 'ずっと文で書いて' | tee 出力/git答え11
          [ "$(grep -c '"notice":"⚠ モデルが道具を使わずに' 出力/git答え11)" = 2 ]
          grep -F '"notice":"⚠ モデルは道具の呼び出しを文で書いただけで、道具は動いていません。' 出力/git答え11
          話す 'push したと言い張って' | tee 出力/git答え5
          [ "$(grep -c '"notice":"⚠ モデルが『できた』と書きましたが' 出力/git答え5)" = 2 ]
          grep -F '"notice":"⚠ この答えの中で、push する道具(github_push)は push していません' 出力/git答え5
          # 前の答えに画面が足した道具の跡は、モデルに送らない
          curl -s -X POST --data-binary @- $B/api/conversations/1/messages > /dev/null <<'跡'
          {"role":"assistant","content":"見ます\n\n~~~~console\n$ ls\na.py\n~~~~\n\n\u2063道具:run\n\n🐙 o/r の枝 a に push しました(abc)\n\u2063道具:github_push\n\nできました"}
          跡
          話す '跡を見て' | grep -F '"content":"跡なし"'
          # 前の答えで本当に push していれば、また push したと書いても、知らせも頼み直しもしない
          話す 'push したと言って' | tee 出力/git答え6
          grep -F 'push しました' 出力/git答え6
          if grep -F '"notice"' 出力/git答え6; then exit 1; fi
          # 履歴のつながらない枝の PR は、clone し直すように添える。clone し直すと、前のものは .old- に移す
          話す 'つながらない PR' | tee 出力/git答え7
          grep -F 'no history in common with main' 出力/git答え7
          話す 'clone し直して' | grep -F '"summary":"🐙 o/r を /work/r に clone しました(枝 main)。前のものは /work/r.old-'
          ls -d 出力/作業G/1/r.old-*
          [ -d 出力/作業G/1/r/.git ]
          # 空のリポジトリは、はじめの commit を既定の枝に push できる
          curl -s -X PUT -d '{"repos":[{"repo":"o/r","write":true},{"repo":"o/empty","write":true}]}' $B/api/conversations/1 > /dev/null
          話す '空を clone して' | grep -F '"summary":"🐙 o/empty を /work/empty に clone しました(空のリポジトリ)"'
          printf 'はじめ\n' > 出力/作業G/1/empty/README.md
          話す '空に push して' | grep -F '"summary":"🐙 o/empty の枝 main に push しました('
          [ "$(git --git-dir 出力/裸/o/empty.git show main:README.md)" = はじめ ]
          # 読むだけにすると、push の道具を渡さない
          curl -s -X PUT -d '{"repos":[{"repo":"o/r","write":false}]}' $B/api/conversations/1 > /dev/null
          話す 'push して' | grep -c 'push しています' | grep -x 0
          # push が断られたのに push したと答えたら、確かめてやり直すように頼み、モデルが別の枝に push し直す(新しい会話で)
          curl -s -X POST -d '{"model":"偽"}' $B/api/conversations > /dev/null
          curl -s -X PUT -d '{"repos":[{"repo":"o/r","write":true}]}' $B/api/conversations/2 > /dev/null
          話す2() { curl -s -X POST -d "{\"role\":\"user\",\"content\":\"$1\"}" $B/api/conversations/2/messages > /dev/null; curl -s -X POST -d '{"conversation":2,"code":true,"github":true}' $B/api/chat; }
          話す2 'o/r を clone して' | grep -F '"summary":"🐙 o/r を /work/r に clone しました'
          # push していないのに、枝が GitHub にあると答えたら、サーバーが GitHub の枝の一覧で確かめて、ないと知らせて頼み直す
          話す2 '枝があると言って' | tee 出力/git答え10
          grep -F '"notice":"⚠ 答えにある枝 ohanashi/nothere は GitHub にありません(サーバーが確かめました)。' 出力/git答え10
          grep -F '"content":"枝がないと言われました"' 出力/git答え10
          printf '3行目\n' >> 出力/作業G/2/r/README.md
          話す2 '押し直しを試して' | tee 出力/git答え9
          grep -F '"summary":"🐙 書けませんでした: 既定の枝(main)には push しません。' 出力/git答え9
          grep -F '"notice":"⚠ モデルが『できた』と書きましたが' 出力/git答え9
          grep -F '"summary":"🐙 o/r の枝 ohanashi/retry に push しました(' 出力/git答え9
          [ "$(git --git-dir 出力/裸/o/r.git show ohanashi/retry:README.md | tail -n 1)" = 3行目 ]
          if grep -F 'push していません' 出力/git答え9; then exit 1; fi
          kill $A $F
          docker rm -f ohanashi-8100-1 ohanashi-8100-2 > /dev/null
      - name: 起動.sh で、画面から頼んで動かし直す
        run: |
          ./出力/偽Ollama 11438 > 出力/偽Ollama4.log 2>&1 &
          F=$!
          ./起動.sh -- --ollama http://127.0.0.1:11438 --db 出力/起動.db --port 8094 > 出力/起動.log 2>&1 &
          S=$!
          for i in $(seq 300); do curl -s -o /dev/null http://127.0.0.1:8094/ && break; sleep 1; done
          B=http://127.0.0.1:8094
          curl -s $B/api/info | tee 出力/情報1 | grep -F '"restart":true'
          grep -F '"revision":"'"$(git rev-parse --short HEAD)"'"' 出力/情報1
          curl -s -X POST $B/api/restart | grep -F '{"restarting":true}'
          OLD=$(grep -o '"started":[0-9.]*' 出力/情報1)
          NEW=
          for i in $(seq 120); do NEW=$(curl -s $B/api/info | grep -o '"started":[0-9.]*' || true); [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] && break; sleep 1; done
          [ -n "$NEW" ] && [ "$NEW" != "$OLD" ]
          grep -aF '画面から頼まれたので' 出力/起動.log
          # 起動.sh を止めると、アプリも止まる
          kill $S; sleep 3
          ! curl -s -o /dev/null http://127.0.0.1:8094/
          # 起動.sh から動かしていなければ、再起動は頼めない
          ./出力/ohanashi-ollama --ollama http://127.0.0.1:11438 --db 出力/起動.db --port 8097 > 出力/アプリ4.log 2>&1 &
          A=$!
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8097/ && break; sleep 0.2; done
          curl -s http://127.0.0.1:8097/api/info | grep -F '"restart":false'
          curl -s -X POST http://127.0.0.1:8097/api/restart | grep -F '起動.sh から'
          kill $A $F
      - name: 記録を出す(失敗したとき)
        if: failure()
        run: cat 出力/*.log || true
